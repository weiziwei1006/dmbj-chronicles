<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a373;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7a6b5a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 外圈 -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.4"/>
  <!-- 内圈 -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.6"/>
  <!-- 墓门造型 -->
  <path d="M20 44 L20 28 Q20 18 32 18 Q44 18 44 28 L44 44 Z"
        fill="none" stroke="url(#grad)" stroke-width="2" filter="url(#glow)"/>
  <!-- 门缝 -->
  <line x1="32" y1="20" x2="32" y2="44" stroke="url(#grad)" stroke-width="1" opacity="0.5"/>
  <!-- 七星图案（北斗） -->
  <circle cx="26" cy="24" r="1.5" fill="#d4a373" opacity="0.8"/>
  <circle cx="30" cy="22" r="1" fill="#d4a373" opacity="0.6"/>
  <circle cx="34" cy="23" r="1.2" fill="#d4a373" opacity="0.7"/>
  <circle cx="38" cy="25" r="1" fill="#d4a373" opacity="0.6"/>
  <circle cx="40" cy="29" r="1.5" fill="#d4a373" opacity="0.8"/>
  <circle cx="37" cy="33" r="1" fill="#d4a373" opacity="0.6"/>
  <circle cx="33" cy="35" r="1.2" fill="#d4a373" opacity="0.7"/>
</svg>
